services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TZ: Europe/Moscow
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      API_BASE_URL: http://127.0.0.1:8000
      PROXY_URL: http://127.0.0.1:10809
      TZ: Europe/Moscow
      INFLUXDB_URL: http://127.0.0.1:8086
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "tg_bot.bot"]
    volumes:
      - ./logs:/app/logs

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
    command: ["sh", "-c", "redis-server --appendonly yes 2>&1 | tee -a /logs/redis.log"]
    volumes:
      - redis-data:/data
      - ./logs:/logs
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-smart-home}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-kettle}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-secret-admin-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminpassword
    depends_on:
      - influxdb
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  redis-data:
  influxdb-data:
  grafana-data:
